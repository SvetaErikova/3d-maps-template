<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef0f2" />
    <meta name="description" content="Interactive 3D building viewer with rotate and zoom controls." />
    <title>Ak Bars · Building viewer</title>
  </head>
  <body>
    <main id="viewer" aria-label="Interactive 3D building viewer"></main>
    <header class="topbar">
      <div><p class="eyebrow">BUILDING VIEWER</p><h1>Ak Bars<span class="badge">3D</span></h1></div>
      <div class="nav-buttons">
        <button type="button" data-point="1" data-point_description_id="1" disabled aria-pressed="false">1 точка</button>
        <button type="button" data-point="2" data-point_description_id="2" disabled aria-pressed="false">2 точка</button>
        <button type="button" data-point="3" data-point_description_id="3" disabled aria-pressed="false">3 точка</button>
      </div>
      <button id="reset" type="button" disabled title="Reset camera (R)">↺ <span>Reset view</span></button>
      
    </header>
    <div id="status" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="status-text">Loading building…</span></div>
    <p id="point-readout" class="point-readout" hidden aria-live="polite"></p>
		<div class="popup" aria-hidden="true">
				<div class="popup--content">
						<button class="popup--close" type="button">Закрыть</button>
						<div class="popup--content_title">Ресторан Tугай</div>
						<div class="popup--content_description">Ресторан отеля Ак Барс Гольф Резорт отличается уютным средиземноморским интерьером.</div>
						<div class="popup--content_action">Подробнее</div>
				</div>
		</div>
    <footer class="help" id="instructions">
      <span><b>Rotate</b> Left drag</span><span><b>Zoom</b> Scroll</span>
      <span><b>Coordinates</b> P, then click</span>
      <span class="touch-help">Touch: one finger to rotate · pinch to zoom</span>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
